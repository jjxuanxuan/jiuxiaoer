openapi: 3.0.3
info:
  title: 九小二 Backend API
  version: 1.0.0-cp1
  description: 九小二产品一期 Go 后端唯一公开契约，覆盖交易、履约、打印、通知、账号运营与酒类合规。
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: 健康检查
      security: []
      responses:
        "200": { $ref: "#/components/responses/Health" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/customer/send-code:
    post:
      summary: 发送 C 端 mock 验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendCodeReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/customer/sms-login:
    post:
      summary: C 端验证码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmsLoginReq" }
      responses:
        "200": { $ref: "#/components/responses/Token" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/customer/wechat-login:
    post:
      summary: 微信小程序登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WeChatLoginReq" }
      responses:
        "200": { $ref: "#/components/responses/Token" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/customer/phone-bind:
    post:
      summary: 绑定微信授权手机号
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneBindReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/admin/login:
    post:
      summary: 管理员登录
      security: []
      requestBody: { $ref: "#/components/requestBodies/PasswordLogin" }
      responses:
        "200": { $ref: "#/components/responses/Token" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/merchant/login:
    post:
      summary: 商户登录
      security: []
      requestBody: { $ref: "#/components/requestBodies/PasswordLogin" }
      responses:
        "200": { $ref: "#/components/responses/Token" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/rider/send-code:
    post:
      summary: 发送骑手登录或申请用的 mock 验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendCodeReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/rider/sms-login:
    post:
      summary: 已审核骑手使用手机号和短信验证码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmsLoginReq" }
      responses:
        "200": { $ref: "#/components/responses/Token" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/rider-application/sms-login:
    post:
      summary: 待审核骑手使用手机号和短信验证码登录并签发受限 Token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmsLoginReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /rider-applications:
    post:
      summary: 骑手首次提交申请
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiderApplicationSubmitReq" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /rider-applications/me:
    get:
      summary: 查看本人骑手申请
      security:
        - applicationBearer: []
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      summary: 修改被拒绝的本人申请
      security:
        - applicationBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiderApplicationUpdateReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /rider-applications/me/resubmit:
    post:
      summary: 重新提交原骑手申请
      security:
        - applicationBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiderApplicationVersionReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/refresh:
    post:
      summary: 刷新 token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshReq" }
      responses:
        "200": { $ref: "#/components/responses/Token" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      summary: 登出并写入 JWT 黑名单
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /realtime/tickets:
    post:
      summary: 签发骑手 WebSocket 一次性连接票据
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RealtimeTicketReq" }
      responses:
        "201": { $ref: "#/components/responses/RealtimeTicket" }
        default: { $ref: "#/components/responses/Problem" }
  /realtime/ws:
    get:
      summary: 骑手实时履约 WebSocket（协议版本 1）
      description: 使用一次性 ticket 完成升级；升级后支持 hello、resume、event、ack、ack_result、sync_complete、error 与 server_shutdown 帧。
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          schema: { type: string, minLength: 20, maxLength: 256 }
      responses:
        "101": { description: WebSocket upgrade accepted }
        default: { $ref: "#/components/responses/Problem" }
  /categories:
    get:
      summary: 分类列表
      security: []
      responses:
        "200": { $ref: "#/components/responses/Page" }
        default: { $ref: "#/components/responses/Problem" }
  /products:
    get:
      summary: 公共商品列表
      security: []
      parameters:
        - $ref: "#/components/parameters/LocationContext"
        - $ref: "#/components/parameters/AnonymousSession"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: shop_id, in: query, schema: { type: string } }
        - { name: category_id, in: query, schema: { type: string } }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: city_code, in: query, schema: { type: string, pattern: "^[0-9]{6}$" } }
        - { name: lat, in: query, schema: { type: number, format: double } }
        - { name: lng, in: query, schema: { type: number, format: double } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
        default: { $ref: "#/components/responses/Problem" }
  /products/{id}:
    get:
      summary: 公共商品详情
      security: []
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/LocationContext"
        - $ref: "#/components/parameters/AnonymousSession"
        - { name: shop_id, in: query, schema: { type: string } }
        - { name: city_code, in: query, schema: { type: string, pattern: "^[0-9]{6}$" } }
        - { name: lat, in: query, schema: { type: number, format: double } }
        - { name: lng, in: query, schema: { type: number, format: double } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /search/discovery:
    get:
      summary: C端搜索发现（个人历史与城市优先热门词）
      description: 游客仅返回热门词；登录 customer 额外返回最近 180 天内的个人历史。热门词按城市榜、全局榜、默认词依次去重补齐。
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LocationContext"
        - $ref: "#/components/parameters/AnonymousSession"
        - { name: history_limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 10 } }
        - { name: hot_limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 10 } }
      responses:
        "200": { $ref: "#/components/responses/SearchDiscovery" }
        default: { $ref: "#/components/responses/Problem" }
  /search/events:
    post:
      summary: 记录登录 C 端用户的一次搜索
      description: 所有合法来源都会更新个人历史；仅 source=manual 且通过隐私与屏蔽词校验时计入城市及全局热门统计。每位 customer 限制为每分钟 30 次。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/LocationContext"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchEventReq" }
      responses:
        "200": { $ref: "#/components/responses/SearchEvent" }
        default: { $ref: "#/components/responses/Problem" }
  /search/history:
    delete:
      summary: 清空当前 C 端用户的搜索历史
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/SearchHistoryClear" }
        default: { $ref: "#/components/responses/Problem" }
  /shops:
    get:
      summary: 公共门店列表
      security: []
      parameters:
        - $ref: "#/components/parameters/LocationContext"
        - $ref: "#/components/parameters/AnonymousSession"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: city_code, in: query, schema: { type: string, pattern: "^[0-9]{6}$" } }
        - { name: lat, in: query, schema: { type: number, format: double } }
        - { name: lng, in: query, schema: { type: number, format: double } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
        default: { $ref: "#/components/responses/Problem" }
  /service-shops/resolve:
    get:
      summary: 按城市和坐标解析唯一服务门店
      security: []
      parameters:
        - { name: city_code, in: query, required: true, schema: { type: string, pattern: "^[0-9]{6}$" } }
        - { name: lat, in: query, required: true, schema: { type: number, format: double, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /service-cities:
    get:
      summary: 已发布服务城市列表
      security: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: keyword, in: query, schema: { type: string, maxLength: 128 } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
        default: { $ref: "#/components/responses/Problem" }
  /location-contexts:
    post:
      summary: 设备位置或本人保存地址解析为短期位置上下文
      description: 匿名请求必须携带 X-Session-ID；登录请求可携带 Bearer Token。精确坐标仅允许出现在本请求 JSON body。
      security: []
      parameters:
        - $ref: "#/components/parameters/AnonymousSession"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationResolveReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /location-contexts/city:
    post:
      summary: 创建仅城市级的位置上下文
      security: []
      parameters:
        - $ref: "#/components/parameters/AnonymousSession"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CityContextReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /location-contexts/{id}/service-shops:
    get:
      summary: 当前位置上下文的可服务仓
      security: []
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/AnonymousSession"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200": { $ref: "#/components/responses/Page" }
        default: { $ref: "#/components/responses/Problem" }
  /location-contexts/{id}/service-shop:
    put:
      summary: 在可服务候选内手动切换仓
      security: []
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/AnonymousSession"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchServiceShopReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/service-cities:
    get:
      summary: 管理服务城市
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200": { $ref: "#/components/responses/Page" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: 创建服务城市草稿及行政区映射
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceCityWriteReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/service-cities/{id}:
    put:
      summary: 更新非发布态服务城市及行政区映射
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceCityWriteReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/service-cities/{id}/status:
    post:
      summary: 发布或停用服务城市
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceStatusReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/delivery-promise-policies:
    get:
      summary: 管理配送承诺展示规则
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200": { $ref: "#/components/responses/Page" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: 创建配送承诺规则版本草稿
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromisePolicyWriteReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/delivery-promise-policies/{id}:
    put:
      summary: 更新配送承诺规则草稿
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromisePolicyWriteReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/delivery-promise-policies/{id}/status:
    post:
      summary: 发布或退役配送承诺规则版本
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceStatusReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /cart/items:
    get:
      summary: 购物车列表
      responses:
        "200": { $ref: "#/components/responses/Page" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: 加购
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { $ref: "#/components/requestBodies/CartItemAdd" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: 清空本人购物车或指定门店商品
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: shop_id, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /cart/items/{id}:
    put:
      summary: 修改购物车数量
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { $ref: "#/components/requestBodies/CartItemUpdate" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: 删除购物车商品
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /cart/items/{id}/selection:
    patch:
      summary: 修改购物车单项选中状态
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selected]
              properties: { selected: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /cart/selection:
    post:
      summary: 按门店批量修改选中状态
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selected, shop_id]
              properties:
                selected: { type: boolean }
                shop_id: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /addresses:
    get:
      summary: 地址列表
      responses:
        "200": { $ref: "#/components/responses/Page" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: 新增地址
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { $ref: "#/components/requestBodies/AddressUpsert" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /addresses/{id}:
    put:
      summary: 全量更新本人地址
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { $ref: "#/components/requestBodies/AddressUpdate" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: 软删除本人地址
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /addresses/{id}/set-default:
    post:
      summary: 设置本人默认地址
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /orders:
    get:
      summary: C 端本人订单列表
      responses:
        "200": { $ref: "#/components/responses/Page" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: 创建订单并预占库存
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderCreateReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /orders/{id}:
    get:
      summary: 订单详情
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /orders/{id}/cancel:
    post:
      summary: 取消订单
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
