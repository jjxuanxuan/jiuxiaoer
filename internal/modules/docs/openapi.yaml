      x-permission: wine_ticket_lot:list_all
      x-object-scope: global
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: owner_customer_id, in: query, schema: { type: string, pattern: "^[1-9][0-9]{0,19}$" } }
