        - $ref: "#/components/parameters/DeliveryIncidentIdempotencyKey"
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DeliveryIncidentRejectReq" } } } }
      responses:
        "200": { $ref: "#/components/responses/DeliveryIncident" }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    applicationBearer:
      type: http
      scheme: bearer
      bearerFormat: application_access JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }
    PageToken:
      name: page_token
      in: query
      schema: { type: string }
    WineTicketPackageNo:
      name: package_no
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]+$", minLength: 1, maxLength: 64 }
    WineTicketPurchaseNo:
      name: purchase_no
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]+$", minLength: 1, maxLength: 64 }
    WineTicketLotNo:
      name: lot_no
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]+$", minLength: 1, maxLength: 64 }
    WineTicketGiftNo:
      name: gift_no
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]+$", minLength: 1, maxLength: 64 }
    WineTicketRedemptionNo:
      name: redemption_no
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]+$", minLength: 1, maxLength: 64 }
    WineTicketRenewalNo:
      name: renewal_no
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]+$", minLength: 1, maxLength: 64 }
    WineTicketRefundNo:
      name: refund_no
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]+$", minLength: 1, maxLength: 64 }
    WineTicketExceptionNo:
      name: exception_no
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]+$", minLength: 1, maxLength: 64 }
    WineTicketSlotID:
      name: slot_id
      in: path
      required: true
      schema: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
    WineGiftToken:
      name: X-Wine-Gift-Token
      in: header
      required: true
      description: 酒票转赠能力令牌。不得写入 URL、JSON body、日志、埋点、审计或持久化明文。
      schema: { type: string, pattern: "^[A-Za-z0-9_-]+$", minLength: 43, maxLength: 256 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    DeliveryIncidentIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 64, pattern: "^[!-~]+$" }
    DeliveryIncidentEvidenceID:
      name: evidence_id
      in: path
      required: true
      schema: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
    DeliveryIncidentType:
      name: type
      in: query
      schema: { type: string, enum: [out_of_stock, alcohol_damaged, customer_refused, customer_unreachable] }
    DeliveryIncidentStatus:
      name: status
      in: query
      schema: { type: string, enum: [evidence_required, open, acknowledged, resolved, rejected] }
    DeliveryIncidentStage:
      name: stage
      in: query
      schema: { type: string, enum: [pickup, delivery] }
    ReportedFrom:
      name: reported_from
      in: query
      schema: { type: string, format: date-time }
    ReportedTo:
      name: reported_to
      in: query
      schema: { type: string, format: date-time }
    LocationContext:
      name: X-Location-Context
      in: header
      schema: { type: string, pattern: "^loc_[A-Za-z0-9_-]{32}$" }
    RequiredLocationContext:
      name: X-Location-Context
      in: header
      required: true
      schema: { type: string, pattern: "^loc_[A-Za-z0-9_-]{32}$" }
    AnonymousSession:
      name: X-Session-ID
      in: header
      schema: { type: string, minLength: 16, maxLength: 256 }
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [wechat] }
  headers:
    WineTicketPrivateNoStore:
      description: 酒票客户数据不得被浏览器、网关或共享缓存保存
      x-required-response-header: true
      schema: { type: string, enum: ["private, no-store"] }
    WineTicketPragmaNoCache:
      description: 兼容旧缓存实现的酒票敏感响应禁止缓存标记
      x-required-response-header: true
      schema: { type: string, enum: [no-cache] }
  responses:
    Success:
      description: 请求成功
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SuccessEnvelope" }
    Page:
      description: 分页请求成功
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PageEnvelope" }
    AuditLogPage:
      description: 结构化审计分页结果；不返回明文 IP 或完整 PII
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuditLogPageEnvelope" }
    Token:
      description: 登录或刷新成功
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TokenEnvelope" }
    WeChatToken:
      description: 微信小程序登录成功，并返回手机号绑定状态
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WeChatLoginEnvelope" }
    WeChatLoginRequired:
      description: 手机号尚未完成当前微信小程序首次登录和绑定，固定返回 AUTH_WECHAT_LOGIN_REQUIRED，且不创建新账号
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
          example:
            type: https://api.jiuxiaoer.com/problems/AUTH_WECHAT_LOGIN_REQUIRED
            title: Forbidden
            status: 403
            detail: complete wechat login and phone binding before sms login
            error_code: AUTH_WECHAT_LOGIN_REQUIRED
            request_id: req_xxx
    RealtimeTicket:
      description: 一次性 WebSocket 票据签发成功
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RealtimeTicketEnvelope" }
    Health:
      description: 服务依赖状态
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HealthEnvelope" }
    Problem:
      description: 标准业务或系统错误
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    DeliveryIncident:
      description: 配送异常详情
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DeliveryIncidentEnvelope" }
    DeliveryIncidentPage:
      description: 配送异常分页结果
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DeliveryIncidentPageEnvelope" }
    DeliveryIncidentEvidenceView:
      description: 短时证据查看地址；响应不得缓存，地址有效期不超过5分钟
      headers:
        Cache-Control:
          schema: { type: string, example: no-store }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DeliveryIncidentEvidenceViewEnvelope" }
    DeliveryReturn:
      description: 配送退回详情
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DeliveryReturnEnvelope" }
    SearchDiscovery:
      description: 搜索历史与热门词查询成功
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SearchDiscoveryEnvelope" }
    SearchEvent:
      description: 搜索事件记录成功
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SearchEventEnvelope" }
    SearchHistoryClear:
      description: 搜索历史清空成功
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SearchHistoryClearEnvelope" }
  requestBodies:
    ExpectedVersion:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [expected_version]
            properties:
              expected_version: { type: integer, minimum: 1 }
    PasswordLogin:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PasswordLoginReq" }
    CartItemAdd:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/CartItemAddReq" } } }
    CartItemUpdate:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/CartItemUpdateReq" } } }
    AddressUpsert:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/AddressUpsertReq" } } }
    AddressUpdate:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/AddressUpdateReq" } } }
    MockPay:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/MockPayReq" } } }
    BusinessStatus:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/BusinessStatusReq" } } }
    ShopProductCreate:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/ShopProductCreateReq" } } }
    ShopProductUpdate:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/ShopProductUpdateReq" } } }
    StockAdjust:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/StockAdjustReq" } } }
    ProductUpsert:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/ProductUpsertReq" } } }
    AdminStockAdjust:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/AdminStockAdjustReq" } } }
    MerchantReview:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/MerchantReviewReq" } } }
    HomeSlotWrite:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/HomeSlotWriteReq" } } }
    HomeSlotStatus:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/HomeSlotStatusReq" } } }
  schemas:
    WineTicketRefundPolicy:
      type: object
      additionalProperties: false
      required: [schema_version, enabled, window_hours, require_never_used, fee_amount]
      properties:
        schema_version: { type: integer, enum: [1] }
        enabled: { type: boolean }
        window_hours: { type: integer, minimum: 0, maximum: 8760 }
        require_never_used: { type: boolean, enum: [true] }
        fee_amount: { type: integer, format: int64, enum: [0] }
    WineTicketRenewalPolicy:
      type: object
      additionalProperties: false
