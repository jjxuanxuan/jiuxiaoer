    post:
      summary: 向授权门店设备提交测试打印
      description: 需要 print_setting:test_shop 权限和当前商户门店授权。同一 Idempotency-Key 产生稳定的供应商请求号，防止重复物理打印；测试页不包含顾客个人信息。非授权门店设置统一返回 404。
      x-permission: print_setting:test_shop
      x-object-scope: authorized_shop
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 测试打印提交结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestPrintEnvelope" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
