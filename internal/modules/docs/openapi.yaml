      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/DeliveryIncidentType"
        - $ref: "#/components/parameters/DeliveryIncidentStatus"
