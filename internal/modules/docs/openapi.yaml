openapi: 3.0.3
info:
  title: 九小二 Backend API
  version: 1.0.0-cp1
  description: 九小二产品一期 Go 后端唯一公开契约，覆盖交易、履约、打印、通知、账号运营与酒类合规。
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: 健康检查
      security: []
      responses:
        "200": { $ref: "#/components/responses/Health" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/customer/send-code:
    post:
      summary: 发送 C 端登录验证码
      description: 仅发送一次性验证码，不创建 C 端账号；后续短信登录仍要求该手机号已通过当前微信小程序首次登录并完成绑定。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendCodeReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/customer/sms-login:
    post:
      summary: C 端已绑定账号验证码登录
      description: 仅供已完成当前微信小程序首次登录和手机号绑定的 C 端账号使用。本接口不注册、不创建新账号。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmsLoginReq" }
      responses:
        "200": { $ref: "#/components/responses/Token" }
        "403": { $ref: "#/components/responses/WeChatLoginRequired" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/customer/wechat-login:
    post:
      summary: 微信小程序登录
      description: C 端首次登录入口；根据当前小程序身份创建或查找账号。响应中 phone_bound 表示是否已绑定手机号；未绑定时应继续调用 phone-bind。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WeChatLoginReq" }
      responses:
        "200": { $ref: "#/components/responses/WeChatToken" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/customer/phone-bind:
    post:
      summary: 绑定微信授权手机号
      description: 为已通过当前微信小程序登录的 C 端账号绑定手机号；绑定成功后，后续可选择微信登录或短信登录。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneBindReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/admin/login:
    post:
      summary: 管理员登录
      security: []
      requestBody: { $ref: "#/components/requestBodies/PasswordLogin" }
      responses:
        "200": { $ref: "#/components/responses/Token" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/merchant/login:
    post:
      summary: 商户登录
      security: []
      requestBody: { $ref: "#/components/requestBodies/PasswordLogin" }
      responses:
        "200": { $ref: "#/components/responses/Token" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/rider/send-code:
    post:
      summary: 发送骑手登录或申请用的 mock 验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendCodeReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/rider/sms-login:
    post:
      summary: 已审核骑手使用手机号和短信验证码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmsLoginReq" }
      responses:
        "200": { $ref: "#/components/responses/Token" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/rider-application/sms-login:
    post:
      summary: 待审核骑手使用手机号和短信验证码登录并签发受限 Token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmsLoginReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /rider-applications:
    post:
      summary: 骑手首次提交申请
      description: 相同 Idempotency-Key 与相同请求返回首次结果且不重复消费短信验证码；新的幂等键必须使用尚未消费的一次性验证码。
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiderApplicationSubmitReq" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /rider-applications/me:
    get:
      summary: 查看本人骑手申请
      security:
        - applicationBearer: []
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      summary: 修改被拒绝的本人申请
      security:
        - applicationBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiderApplicationUpdateReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /rider-applications/me/resubmit:
    post:
      summary: 重新提交原骑手申请
      security:
        - applicationBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiderApplicationVersionReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/refresh:
    post:
      summary: 刷新 token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshReq" }
      responses:
        "200": { $ref: "#/components/responses/Token" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      summary: 登出并写入 JWT 黑名单
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /realtime/tickets:
    post:
      summary: 签发骑手 WebSocket 一次性连接票据
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RealtimeTicketReq" }
      responses:
        "201": { $ref: "#/components/responses/RealtimeTicket" }
        default: { $ref: "#/components/responses/Problem" }
  /realtime/ws:
    get:
      summary: 骑手实时履约 WebSocket（协议版本 1）
      description: 使用一次性 ticket 完成升级；升级后支持 hello、resume、event、ack、ack_result、sync_complete、error 与 server_shutdown 帧。
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          schema: { type: string, minLength: 20, maxLength: 256 }
      responses:
        "101": { description: WebSocket upgrade accepted }
        default: { $ref: "#/components/responses/Problem" }
  /categories:
    get:
      summary: 分类列表
      security: []
      responses:
        "200":
          description: 分类列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryListEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /products:
    get:
      summary: 公共商品列表
      security: []
      parameters:
        - $ref: "#/components/parameters/LocationContext"
        - $ref: "#/components/parameters/AnonymousSession"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: shop_id, in: query, schema: { type: string } }
        - { name: category_id, in: query, schema: { type: string } }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: city_code, in: query, schema: { type: string, pattern: "^[0-9]{6}$" } }
        - { name: lat, in: query, schema: { type: number, format: double } }
        - { name: lng, in: query, schema: { type: number, format: double } }
      responses:
        "200":
          description: 公共商品分页列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductListEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /wine-tickets/packages:
    get:
      summary: 酒票套餐公开列表
      description: 仅返回当前销售窗口内已发布的酒票套餐；接口由酒票总开关和套餐公开读取分支开关共同控制。
      security: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: package_type
          in: query
          schema: { type: string, enum: [stockpile, corporate, gift] }
      responses:
        "200":
          description: 酒票套餐公开分页列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WineTicketPackagePageEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /wine-tickets/packages/{package_no}:
    get:
      summary: 酒票套餐公开详情
      description: 仅可读取当前销售窗口内已发布的套餐，不暴露结算标识或原始策略 JSON。
      security: []
      parameters:
        - $ref: "#/components/parameters/WineTicketPackageNo"
      responses:
        "200":
          description: 酒票套餐公开详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WineTicketPackageEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /wine-tickets/purchases:
    get:
      summary: 我的酒票购买记录
      description: 按创建时间倒序返回当前客户的购买记录。page_token 与筛选条件绑定，不得跨客户或跨筛选条件复用。
      x-permission: wine_ticket_purchase:list
      x-object-scope: customer.self_purchases
      x-sensitive-response: true
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: status
          in: query
          schema:
            type: string
            enum: [pending_payment, payment_unknown, settlement_exception, issued, closed, refund_holding, refund_exception, refunded]
      responses:
        "200":
          description: 当前客户的酒票购买分页列表
          headers:
            Cache-Control: { $ref: "#/components/headers/WineTicketPrivateNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WineTicketPurchasePageEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: 购买酒票套餐
      description: 创建酒票购买单并返回微信小程序支付参数。重试必须复用相同 Idempotency-Key 和完全相同的请求体。
      x-permission: wine_ticket_purchase:create
      x-object-scope: customer.self_purchases
      x-sensitive-response: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineTicketPurchaseCreateRequest" }
      responses:
        "201":
          description: 酒票购买单已创建；可能为同一幂等请求的安全重放
          headers:
            Cache-Control: { $ref: "#/components/headers/WineTicketPrivateNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WineTicketPurchaseEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /wine-tickets/purchases/{purchase_no}:
    get:
      summary: 酒票购买详情
      x-permission: wine_ticket_purchase:view
      x-object-scope: customer.self_purchase
      x-sensitive-response: true
      parameters:
        - $ref: "#/components/parameters/WineTicketPurchaseNo"
      responses:
        "200":
          description: 当前客户拥有的酒票购买详情
          headers:
            Cache-Control: { $ref: "#/components/headers/WineTicketPrivateNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WineTicketPurchaseEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /wine-tickets/purchases/{purchase_no}/payment/confirm:
    post:
      summary: 主动确认酒票购买支付结果
      description: 仅查询并收敛支付渠道的权威状态，客户端不能用该接口自行把购买单标记为已支付。请求无 JSON body。
      x-permission: wine_ticket_payment:confirm
      x-object-scope: customer.self_purchase
      x-sensitive-response: true
      parameters:
        - $ref: "#/components/parameters/WineTicketPurchaseNo"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 支付状态已按渠道事实收敛；可能为同一幂等请求的安全重放
          headers:
            Cache-Control: { $ref: "#/components/headers/WineTicketPrivateNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WineTicketPurchaseEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /wine-tickets/cabinet:
    get:
      summary: 我的线上私人酒柜
      description: 按发行商、核销城市和商品聚合当前客户仍可使用的酒票；到期提醒判定以响应中的 server_time 为准。
      x-permission: wine_ticket_cabinet:view
      x-object-scope: customer.self_active_lots
      x-sensitive-response: true
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: 私人酒柜聚合结果，分页游标位于 data.next_page_token
          headers:
            Cache-Control: { $ref: "#/components/headers/WineTicketPrivateNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WineTicketCabinetEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /wine-tickets/lots:
    get:
      summary: 我的酒票批次列表
      description: 返回当前客户拥有的酒票批次及剩余、冻结、已提取数量和有效期。
      x-permission: wine_ticket_lot:list
      x-object-scope: customer.self_lots
      x-sensitive-response: true
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: product_id
          in: query
          description: 商品 uint64 ID 的十进制字符串
          schema: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
        - name: status
          in: query
          schema: { type: string, enum: [active, depleted, expired, refunded] }
      responses:
        "200":
          description: 当前客户的酒票批次分页列表
          headers:
            Cache-Control: { $ref: "#/components/headers/WineTicketPrivateNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WineTicketLotPageEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /wine-tickets/lots/{lot_no}:
    get:
      summary: 酒票批次详情
      x-permission: wine_ticket_lot:view
      x-object-scope: customer.self_lot
      x-sensitive-response: true
      parameters:
        - $ref: "#/components/parameters/WineTicketLotNo"
      responses:
        "200":
          description: 当前客户拥有的酒票批次详情，含最近十条不可变流水
          headers:
            Cache-Control: { $ref: "#/components/headers/WineTicketPrivateNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WineTicketLotEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /wine-tickets/transactions:
    get:
      summary: 我的酒票历史流水
      description: 返回购买发放、转赠冻结/领取/归还、提酒冻结/恢复、退款冻结/恢复和到期等不可变数量流水。
      x-permission: wine_ticket_transaction:list
      x-object-scope: customer.self_lot_transactions
      x-sensitive-response: true
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: lot_no
          in: query
          schema: { type: string, pattern: "^[A-Za-z0-9_-]+$", minLength: 1, maxLength: 64 }
        - name: transaction_type
          in: query
          schema:
            type: string
            enum:
              - purchase_issue
              - redemption_hold
              - redemption_restore
              - redemption_return_restore
              - redemption_return_expire
              - gift_hold
              - gift_claim
              - gift_restore
              - refund_hold
              - refund_restore
              - expiry
      responses:
        "200":
          description: 当前客户的酒票流水分页列表
          headers:
            Cache-Control: { $ref: "#/components/headers/WineTicketPrivateNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WineTicketTransactionPageEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /wine-tickets/delivery-time-slots:
    get:
      summary: 查询酒票提酒可用配送时段
      description: 服务端按地址城市、单一发行商、商品、酒票有效期、门店库存与时段容量计算；客户端不能指定最终履约门店。
      x-permission: wine_ticket_slot:list
      x-object-scope: customer.self_lots_and_address
      x-sensitive-response: true
      parameters:
        - name: product_id
          in: query
          required: true
          schema: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
        - name: quantity
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 1000 }
        - name: address_id
          in: query
          required: true
          schema: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
        - name: address_version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: 当前客户可用的提酒配送时段
          headers:
            Cache-Control: { $ref: "#/components/headers/WineTicketPrivateNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WineTicketRedemptionSlotListEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /wine-tickets/redemptions:
    get:
      summary: 我的提酒记录
      x-permission: wine_ticket_redemption:list
      x-object-scope: customer.self_redemptions
      x-sensitive-response: true
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, assigned, picked_up, delivered, cancelled, return_in_progress, restored, exception]
      responses:
        "200":
          description: 当前客户的提酒记录分页列表
          headers:
            Cache-Control: { $ref: "#/components/headers/WineTicketPrivateNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WineTicketRedemptionPageEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: 使用酒票提酒
      description: 同事务按 FEFO 核销酒票、扣减门店实物库存、占用配送时段并创建 0 元订单与派单任务；本接口不会创建支付单。
      x-permission: wine_ticket_redemption:create
      x-object-scope: customer.self_lots_and_address
      x-sensitive-response: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineTicketRedemptionCreateRequest" }
      responses:
        "201":
          description: 提酒单、0 元订单及预约配送已原子创建
          headers:
            Cache-Control: { $ref: "#/components/headers/WineTicketPrivateNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WineTicketRedemptionEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /wine-tickets/redemptions/{redemption_no}:
    get:
      summary: 提酒详情
      x-permission: wine_ticket_redemption:view
      x-object-scope: customer.self_redemption
      x-sensitive-response: true
      parameters:
        - $ref: "#/components/parameters/WineTicketRedemptionNo"
      responses:
        "200":
          description: 当前客户拥有的提酒详情与履约时间线
          headers:
            Cache-Control: { $ref: "#/components/headers/WineTicketPrivateNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WineTicketRedemptionEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /wine-tickets/redemptions/{redemption_no}/cancel:
    post:
      summary: 取货前取消提酒
      description: 仅 scheduled/assigned 且尚未取货可取消；同事务恢复酒票、时段与实物库存并关闭配送和派单。
      x-permission: wine_ticket_redemption:cancel
      x-object-scope: customer.self_redemption
      x-sensitive-response: true
      parameters:
        - $ref: "#/components/parameters/WineTicketRedemptionNo"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineTicketRedemptionCancelRequest" }
      responses:
        "200":
          description: 提酒已取消且权益、时段、库存均已恢复
          headers:
            Cache-Control: { $ref: "#/components/headers/WineTicketPrivateNoStore" }
          content:
            application/json:
