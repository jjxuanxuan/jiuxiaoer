      x-auth-mode: anonymous_gift_token
      x-object-scope: valid_pending_gift_token
      x-sensitive-response: true
      parameters:
        - $ref: "#/components/parameters/WineGiftToken"
      responses:
        "200":
          description: 待领取酒票的最小化预览
          headers:
            Cache-Control: { $ref: "#/components/headers/WineTicketPrivateNoStore" }
            Pragma: { $ref: "#/components/headers/WineTicketPragmaNoCache" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WineTicketGiftPreviewEnvelope" }
        "404":
          description: 能力令牌不可用；固定 error_code=WT_GIFT_TOKEN_INVALID
          headers:
            Cache-Control: { $ref: "#/components/headers/WineTicketPrivateNoStore" }
            Pragma: { $ref: "#/components/headers/WineTicketPragmaNoCache" }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
              example:
                type: https://api.jiuxiaoer.com/problems/WT_GIFT_TOKEN_INVALID
                title: Not Found
                status: 404
                detail: wine ticket gift is unavailable
                error_code: WT_GIFT_TOKEN_INVALID
                request_id: req_xxx
        default: { $ref: "#/components/responses/Problem" }
  /wine-tickets/gift-claims:
    post:
      summary: 领取酒票转赠
      description: 登录客户凭 X-Wine-Gift-Token 原子领取。赠送人的冻结数量扣除后，等量酒票写入领取人的个人酒柜；原始有效期保持不变。
