      summary: 手工补跑微信交易账单或资金账单对账
      description: 需要 refund:exception 权限和 Idempotency-Key；仅允许补跑最近三个月内已生成的历史账单，重复日期和类型保持幂等。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bill_date, bill_type]
              properties:
                bill_date: { type: string, format: date }
                bill_type: { type: string, enum: [trade_all, fundflow_basic] }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
