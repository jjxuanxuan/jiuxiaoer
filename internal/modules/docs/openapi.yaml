        - { name: purchase_no, in: query, schema: { type: string, pattern: "^[A-Za-z0-9_-]+$" } }
        - { name: status, in: query, schema: { type: string, enum: [active, depleted, expired, refunded] } }
        - { name: product_id, in: query, schema: { type: string, pattern: "^[1-9][0-9]{0,19}$" } }
        - { name: issuer_merchant_id, in: query, schema: { type: string, pattern: "^[1-9][0-9]{0,19}$" } }
