  /wine-tickets/gift-claims/preview:
    get:
      summary: 匿名预览待领取酒票
      description: 仅从 X-Wine-Gift-Token 读取能力令牌。未知、过期、撤销、已消费、已领取或无效令牌统一返回 404/WT_GIFT_TOKEN_INVALID；所有成功和失败响应均禁止共享缓存。
