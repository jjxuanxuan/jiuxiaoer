    get:
      summary: 查看授权门店打印设置
      x-permission: print_setting:view_shop
      x-object-scope: authorized_shop
      parameters:
        - { name: shop_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: 门店打印设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrintSettingEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: 为授权门店创建打印设置
      description: 需要 print_setting:update_shop 权限，且 shop_id 必须在当前商户的授权门店范围内。每个门店只允许一份设置；device_id 只写入加密存储，不会在读接口中明文返回。
      x-permission: print_setting:update_shop
      x-object-scope: authorized_shop
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrintSettingCreateReq" }
      responses:
        "200":
          description: 已创建的门店打印设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrintSettingEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /store/print-settings/{id}:
    patch:
      summary: 更新门店打印设置
      x-permission: print_setting:update_shop
      x-object-scope: authorized_shop
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PrintSettingPatchReq" } } } }
      responses:
        "200":
          description: 更新后的门店打印设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrintSettingEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
