  /admin/wine-tickets/exceptions:
    get:
      summary: 管理端查询酒票三账异常队列
      description: 返回经脱敏的对账证据；快照仅供调查，不能直接作为调账输入。
      x-permission: wine_ticket_exception:list
      x-object-scope: global
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: status, in: query, schema: { type: string, enum: [investigating, awaiting_external_fact, pending_review, resolved] } }
        - { name: severity, in: query, schema: { type: string, enum: [P0, P1, P2, P3] } }
      responses:
        "200":
          description: 酒票异常分页列表
          headers:
            Cache-Control: { $ref: "#/components/headers/WineTicketPrivateNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WineTicketExceptionPageEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/wine-tickets/exceptions/{exception_no}:
    get:
      summary: 管理端查询酒票三账异常详情
      x-permission: wine_ticket_exception:view
      x-object-scope: global
      parameters:
        - $ref: "#/components/parameters/WineTicketExceptionNo"
      responses:
        "200":
          description: 酒票异常详情
          headers:
            Cache-Control: { $ref: "#/components/headers/WineTicketPrivateNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WineTicketExceptionEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/wine-tickets/exceptions/{exception_no}/resolution:
    post:
      summary: 直接处置酒票异常
      description: >
        具备处置权限的管理员提交后立即执行已注册的可信业务 closure，并在同一事务内记录结果。
        历史 pending_review 异常必须由管理员基于当前版本重新提交，不会自动执行旧提案。
      x-permission: wine_ticket_exception:resolve
      x-object-scope: global
      parameters:
        - $ref: "#/components/parameters/WineTicketExceptionNo"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WineTicketExceptionResolutionRequest" }
      responses:
        "200":
          description: 异常处置已执行并记录结果
          headers:
            Cache-Control: { $ref: "#/components/headers/WineTicketPrivateNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WineTicketExceptionEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
