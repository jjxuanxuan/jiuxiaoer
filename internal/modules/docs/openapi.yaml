openapi: 3.0.3
info:
  title: 九小二 Backend API
  version: 1.0.0-cp1
  description: 九小二产品一期 Go 后端唯一公开契约，覆盖交易、履约、打印、通知、账号运营与酒类合规。
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: 健康检查
      security: []
      responses:
        "200": { $ref: "#/components/responses/Health" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/customer/send-code:
    post:
      summary: 发送 C 端登录验证码
      description: 仅发送一次性验证码，不创建 C 端账号；后续短信登录仍要求该手机号已通过当前微信小程序首次登录并完成绑定。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendCodeReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/customer/sms-login:
    post:
      summary: C 端已绑定账号验证码登录
      description: 仅供已完成当前微信小程序首次登录和手机号绑定的 C 端账号使用。本接口不注册、不创建新账号。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmsLoginReq" }
      responses:
        "200": { $ref: "#/components/responses/Token" }
        "403": { $ref: "#/components/responses/WeChatLoginRequired" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/customer/wechat-login:
    post:
      summary: 微信小程序登录
      description: C 端首次登录入口；根据当前小程序身份创建或查找账号。响应中 phone_bound 表示是否已绑定手机号；未绑定时应继续调用 phone-bind。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WeChatLoginReq" }
      responses:
        "200": { $ref: "#/components/responses/WeChatToken" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/customer/phone-bind:
    post:
      summary: 绑定微信授权手机号
      description: 为已通过当前微信小程序登录的 C 端账号绑定手机号；绑定成功后，后续可选择微信登录或短信登录。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneBindReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/admin/login:
    post:
      summary: 管理员登录
      security: []
      requestBody: { $ref: "#/components/requestBodies/PasswordLogin" }
      responses:
        "200": { $ref: "#/components/responses/Token" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/merchant/login:
    post:
      summary: 商户登录
      security: []
      requestBody: { $ref: "#/components/requestBodies/PasswordLogin" }
      responses:
        "200": { $ref: "#/components/responses/Token" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/rider/send-code:
    post:
      summary: 发送骑手登录或申请用的 mock 验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendCodeReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/rider/sms-login:
    post:
      summary: 已审核骑手使用手机号和短信验证码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmsLoginReq" }
      responses:
        "200": { $ref: "#/components/responses/Token" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/rider-application/sms-login:
    post:
      summary: 待审核骑手使用手机号和短信验证码登录并签发受限 Token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmsLoginReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /rider-applications:
    post:
      summary: 骑手首次提交申请
      description: 相同 Idempotency-Key 与相同请求返回首次结果且不重复消费短信验证码；新的幂等键必须使用尚未消费的一次性验证码。
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiderApplicationSubmitReq" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /rider-applications/me:
    get:
      summary: 查看本人骑手申请
      security:
        - applicationBearer: []
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      summary: 修改被拒绝的本人申请
      security:
        - applicationBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiderApplicationUpdateReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /rider-applications/me/resubmit:
    post:
      summary: 重新提交原骑手申请
      security:
        - applicationBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiderApplicationVersionReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/refresh:
    post:
      summary: 刷新 token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshReq" }
      responses:
        "200": { $ref: "#/components/responses/Token" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      summary: 登出并写入 JWT 黑名单
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /realtime/tickets:
    post:
      summary: 签发骑手 WebSocket 一次性连接票据
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RealtimeTicketReq" }
      responses:
        "201": { $ref: "#/components/responses/RealtimeTicket" }
        default: { $ref: "#/components/responses/Problem" }
  /realtime/ws:
    get:
      summary: 骑手实时履约 WebSocket（协议版本 1）
      description: 使用一次性 ticket 完成升级；升级后支持 hello、resume、event、ack、ack_result、sync_complete、error 与 server_shutdown 帧。
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          schema: { type: string, minLength: 20, maxLength: 256 }
      responses:
        "101": { description: WebSocket upgrade accepted }
        default: { $ref: "#/components/responses/Problem" }
  /categories:
    get:
      summary: 分类列表
      security: []
      responses:
        "200":
          description: 分类列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryListEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /products:
    get:
      summary: 公共商品列表
      security: []
      parameters:
        - $ref: "#/components/parameters/LocationContext"
        - $ref: "#/components/parameters/AnonymousSession"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: shop_id, in: query, schema: { type: string } }
        - { name: category_id, in: query, schema: { type: string } }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: city_code, in: query, schema: { type: string, pattern: "^[0-9]{6}$" } }
        - { name: lat, in: query, schema: { type: number, format: double } }
        - { name: lng, in: query, schema: { type: number, format: double } }
      responses:
        "200":
          description: 公共商品分页列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductListEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /products/{id}:
    get:
      summary: 公共商品详情
      x-auth-mode: public_optional_identity
      x-object-scope: public_optional_location_context
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/LocationContext"
        - $ref: "#/components/parameters/AnonymousSession"
        - { name: shop_id, in: query, schema: { type: string } }
        - { name: city_code, in: query, schema: { type: string, pattern: "^[0-9]{6}$" } }
        - { name: lat, in: query, schema: { type: number, format: double } }
        - { name: lng, in: query, schema: { type: number, format: double } }
      responses:
        "200":
          description: 按服务门店上下文返回的商品详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetailEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /search/discovery:
    get:
      summary: C端搜索发现（个人历史与城市优先热门词）
      description: 游客仅返回热门词；登录 customer 额外返回最近 180 天内的个人历史。热门词按城市榜、全局榜、默认词依次去重补齐。
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LocationContext"
        - $ref: "#/components/parameters/AnonymousSession"
        - { name: history_limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 10 } }
        - { name: hot_limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 10 } }
      responses:
        "200": { $ref: "#/components/responses/SearchDiscovery" }
        default: { $ref: "#/components/responses/Problem" }
  /search/events:
    post:
      summary: 记录登录 C 端用户的一次搜索
      description: 所有合法来源都会更新个人历史；仅 source=manual 且通过隐私与屏蔽词校验时计入城市及全局热门统计。每位 customer 限制为每分钟 30 次。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/LocationContext"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchEventReq" }
      responses:
        "200": { $ref: "#/components/responses/SearchEvent" }
        default: { $ref: "#/components/responses/Problem" }
  /search/history:
    delete:
      summary: 清空当前 C 端用户的搜索历史
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/SearchHistoryClear" }
        default: { $ref: "#/components/responses/Problem" }
  /shops:
    get:
      summary: 公共门店列表
      security: []
      parameters:
        - $ref: "#/components/parameters/LocationContext"
        - $ref: "#/components/parameters/AnonymousSession"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: city_code, in: query, schema: { type: string, pattern: "^[0-9]{6}$" } }
        - { name: lat, in: query, schema: { type: number, format: double } }
        - { name: lng, in: query, schema: { type: number, format: double } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
        default: { $ref: "#/components/responses/Problem" }
  /service-shops/resolve:
    get:
      summary: 按城市和坐标解析唯一服务门店
      security: []
      parameters:
        - { name: city_code, in: query, required: true, schema: { type: string, pattern: "^[0-9]{6}$" } }
        - { name: lat, in: query, required: true, schema: { type: number, format: double, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /service-cities:
    get:
      summary: 已发布服务城市列表
      security: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: keyword, in: query, schema: { type: string, maxLength: 128 } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
        default: { $ref: "#/components/responses/Problem" }
  /location-contexts:
    post:
      summary: 设备位置或本人保存地址解析为短期位置上下文
      description: 匿名请求必须携带 X-Session-ID；登录请求可携带 Bearer Token。精确坐标仅允许出现在本请求 JSON body。
      security: []
      parameters:
        - $ref: "#/components/parameters/AnonymousSession"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationResolveReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /location-contexts/city:
    post:
      summary: 创建仅城市级的位置上下文
      security: []
      parameters:
        - $ref: "#/components/parameters/AnonymousSession"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CityContextReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /location-contexts/{id}/service-shops:
    get:
      summary: 当前位置上下文的可服务仓
      security: []
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/AnonymousSession"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200": { $ref: "#/components/responses/Page" }
        default: { $ref: "#/components/responses/Problem" }
  /location-contexts/{id}/service-shop:
    put:
      summary: 在可服务候选内手动切换仓
      security: []
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/AnonymousSession"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchServiceShopReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/service-cities:
    get:
      summary: 管理服务城市
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200": { $ref: "#/components/responses/Page" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: 创建服务城市草稿及行政区映射
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceCityWriteReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/service-cities/{id}:
    put:
      summary: 更新非发布态服务城市及行政区映射
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceCityWriteReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/service-cities/{id}/status:
    post:
      summary: 发布或停用服务城市
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceStatusReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/delivery-promise-policies:
    get:
      summary: 管理配送承诺展示规则
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200": { $ref: "#/components/responses/Page" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: 创建配送承诺规则版本草稿
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromisePolicyWriteReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/delivery-promise-policies/{id}:
    put:
      summary: 更新配送承诺规则草稿
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromisePolicyWriteReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/delivery-promise-policies/{id}/status:
    post:
      summary: 发布或退役配送承诺规则版本
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceStatusReq" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        default: { $ref: "#/components/responses/Problem" }
  /cart/items:
    get:
      summary: 购物车列表
      description: 返回本人购物车完整快照与当前可用性计算结果。
      x-permission: cart:view
      x-object-scope: customer.self_cart
      responses:
        "200":
          description: 本人购物车快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: 加购
      x-permission: cart:update
      x-object-scope: customer.self_cart
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { $ref: "#/components/requestBodies/CartItemAdd" }
      responses:
        "200":
          description: 加购后的本人购物车快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: 清空本人购物车或指定门店商品
      x-permission: cart:update
      x-object-scope: customer.self_cart
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: shop_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: 清空成功，data 为空对象
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartEmptyEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /cart/items/{id}:
    put:
      summary: 修改购物车数量
      x-permission: cart:update
      x-object-scope: customer.self_cart_item
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { $ref: "#/components/requestBodies/CartItemUpdate" }
      responses:
        "200":
          description: 修改后的本人购物车快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: 删除购物车商品
      x-permission: cart:update
      x-object-scope: customer.self_cart_item
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 删除成功，data 为空对象
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartEmptyEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /cart/items/{id}/selection:
    patch:
      summary: 修改购物车单项选中状态
      x-permission: cart:update
      x-object-scope: customer.self_cart_item
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartItemSelectionReq" }
      responses:
        "200":
          description: 修改后的本人购物车快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /cart/selection:
    post:
      summary: 按门店批量修改选中状态
      x-permission: cart:update
      x-object-scope: customer.self_cart
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartSelectionReq" }
      responses:
        "200":
          description: 修改后的本人购物车快照
          content:
